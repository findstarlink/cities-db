# Generated initially using github-actions-wizard (https://github.com/cmdr2/github-actions-wizard)

name: CI Pipeline
run-name: CI Pipeline
on:
  release:
    types:
    - created
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'
        cache: pip
    - name: Install dependencies
      run: |-
        pip install -r requirements.txt
    - name: Fetch cities data
      run: |-
        sh import-db.sh
    - name: Build the bundle
      run: |-
        sh make-bundle.sh
        mv build build-temp
    - name: Zip individual build targets
      run: |-
        mkdir build
        cd build-temp
        zip -r ../build/cities_web.zip cities_bundle.bin ../cityDatabase.js
        zip -r ../build/cities_sqlite_geohash.zip cities_geohash.db
        zip -r ../build/cities_sqlite_simple.zip cities_simple.db
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: build
        path: build
  deploy_to_gh_release_on_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    if: github.event_name == 'release' && github.event.action == 'created'
    needs: build
    steps:
    - name: Download Artifact
      uses: actions/download-artifact@v5
      with:
        name: build
        path: .
    - name: Release
      uses: softprops/action-gh-release@v2
      if: github.ref_type == 'tag'
      with:
        files: |-
          cities_web.zip
          cities_sqlite_simple.zip
          cities_sqlite_geohash.zip
